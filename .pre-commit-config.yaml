repos:
  # Run the tools straight from the repo's own node_modules so the hooks
  # always use the same versions and config as CI (no isolated, duplicated
  # dependency pins to drift).
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [ts, javascript, json, yaml]
        exclude: ^(package-lock\.json$|reports/|allure-results/|allure-report/|test-results/)

      - id: eslint
        name: eslint
        entry: npx eslint --fix --max-warnings=0
        language: system
        files: \.[cm]?[jt]sx?$
        exclude: ^reports/

      - id: typecheck
        name: tsc --noEmit
        entry: npx tsc --noEmit
        language: system
        files: \.tsx?$
        pass_filenames: false
