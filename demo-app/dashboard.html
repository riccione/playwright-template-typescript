<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Playwright Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #f4f5f7;
      }
      main {
        background: #fff;
        padding: 2rem;
        border-radius: 8px;
        width: min(480px, 90vw);
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.1);
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="status">Checking session…</h1>
      <p id="hint" hidden>You are seeing this page because your browser context carries a saved session cookie.</p>
      <button id="sign-out" type="button" hidden>Sign Out</button>
    </main>
    <script>
      const status = document.getElementById('status');
      fetch('/me')
        .then(async (response) => {
          if (response.ok) {
            const { username } = await response.json();
            status.textContent = `Welcome, ${username}`;
            document.getElementById('hint').hidden = false;
            document.getElementById('sign-out').hidden = false;
          } else {
            status.textContent = 'Not signed in';
          }
        });
      document.getElementById('sign-out').addEventListener('click', async () => {
        await fetch('/logout', { method: 'POST' });
        location.assign('/');
      });
    </script>
  </body>
</html>
